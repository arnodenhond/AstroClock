plugins {
    id 'com.android.application'
}

android {
    namespace 'arnodenhond.astroclocklite'
    compileSdk 36

    defaultConfig {
        applicationId "arnodenhond.astroclocklite"
        minSdk 30
        targetSdk 36
        versionCode 23060729
        versionName "23060729"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.1"
    // Use to implement support for wear tiles
    implementation "androidx.wear.tiles:tiles:1.5.0"

    // Use to utilize components and layouts with Material Design in your tiles
    implementation "androidx.wear.tiles:tiles-material:1.5.0"

    implementation "com.google.guava:guava:33.5.0-android"
    implementation "androidx.wear:wear:1.3.0"
    // includes support for wearable specific inputs
    implementation "androidx.wear:wear-input:1.2.0"
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Use to preview wear tiles in your own app
    debugImplementation "androidx.wear.tiles:tiles-renderer:1.5.0"

    // Use to fetch tiles from a tile provider in your tests
    testImplementation "androidx.wear.tiles:tiles-testing:1.5.0"

    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}